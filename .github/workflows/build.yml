name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev zlib1g-dev libffi-dev libssl-dev libssl3
          pip install --upgrade pip buildozer cython kivy

      - name: Build with Buildozer
        run: |
          buildozer init
          sed -i 's/^title =.*/title = My Browser/' buildozer.spec
          sed -i 's/^package.name =.*/package.name = mybrowser/' buildozer.spec
          sed -i 's/^requirements =.*/requirements = python3,kivy==2.3.0,android,pyjnius/' buildozer.spec
          sed -i 's/#android.permissions =.*/android.permissions = INTERNET/' buildozer.spec
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyBrowser-APK
          path: bin/*.apk
